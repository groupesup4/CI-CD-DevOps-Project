name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Code Quality (Lint)
        # Bloque le pipeline si le code ne respecte pas les règles ESLint [cite: 71]
        run: |
          cd app
          npx eslint .

      - name: Run Unit Tests
        # Utilise ton script ou directement npm test [cite: 68]
        run: ./scripts/test.sh