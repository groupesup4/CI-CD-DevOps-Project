name: CI/CD Pipeline

on:
  push:
    branches: [ dev1 ]
  pull_request:
    branches: [ dev1 ]

jobs:
  # JOB 1 : CI - Qualité et Tests ( Étudiant A )
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: conduit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Code Quality (Lint)
        run: |
          cd app
          npm run lint || echo "Linting failed but continuing for educational purposes"
        continue-on-error: true

      - name: Run Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/conduit?schema=public"
        run: |
          cd app
          npx prisma db push --schema=src/prisma/schema.prisma
          cd ..
          chmod +x ./scripts/test.sh
          ./scripts/test.sh
        continue-on-error: true 

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # JOB 2 : Build & Artifacts (Étudiant B)
  build-and-push:
    needs: quality-and-tests
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Image using script
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

# --- ÉTAPE SEC-OPS : SCAN TRIVY ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/api-nodejs:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # --- ÉTAPE SEC-OPS : GÉNÉRATION DU RAPPORT ---
      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: trivy-results.sarif

      - name: Push Image to GHCR
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/api-nodejs"
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

          
 # JOB 3 : CD - Déploiement Azure (Étudiant C)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev1' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Delete old container (if exists)
        run: |
          az container delete \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name api-conduit \
            --yes || echo "No existing container to delete"
      
      - name: Deploy to Azure Container Instances
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name api-conduit \
            --image ghcr.io/${{ github.repository_owner }}/api-conduit:${{ github.sha }} \
            --registry-login-server ghcr.io \
            --registry-username ${{ github.actor }} \
            --registry-password ${{ secrets.GITHUB_TOKEN }} \
            --dns-name-label api-conduit-${{ github.run_number }} \
            --location westeurope \
            --cpu 1 \
            --memory 1.5 \
            --ports 3000 \
            --environment-variables \
              NODE_ENV=production \
              PORT=3000 \
            --secure-environment-variables \
              DATABASE_URL=${{ secrets.DATABASE_URL }} \
              JWT_SECRET=${{ secrets.JWT_SECRET }}
      
      - name: Get Application URL
        run: |
          FQDN=$(az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name api-conduit \
            --query ipAddress.fqdn \
            --output tsv)
          
          echo "### Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Application URL:** http://${FQDN}:3000" >> $GITHUB_STEP_SUMMARY
          echo "**API Health:** http://${FQDN}:3000/api/tags" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Container:** api-conduit" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository_owner }}/api-conduit:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
      
      - name: Wait and Health Check
        run: |
          echo "Waiting 30 seconds for container startup..."
          sleep 30
          
          FQDN=$(az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name api-conduit \
            --query ipAddress.fqdn \
            --output tsv)
          
          echo "Testing API at http://${FQDN}:3000/api/tags"
          curl -f http://${FQDN}:3000/api/tags || echo "Health check failed - container may still be starting"

