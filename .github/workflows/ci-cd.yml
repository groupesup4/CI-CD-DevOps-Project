name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # JOB 1 : CI - Qualité et Tests ( Étudiant A )
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: conduit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Code Quality (Lint)
        run: |
          cd app
          npm run lint || echo "Linting failed but continuing for educational purposes"
        continue-on-error: true


      - name: Run Unit Tests
        env:
          DATABASE_URL: "postgresql://postgres:${{ secrets.DB_PASSWORD }}@localhost:5432/conduit?schema=public"
        run: |
          cd app
          npx prisma db push --schema=src/prisma/schema.prisma
          cd ..
          chmod +x ./scripts/test.sh
          ./scripts/test.sh
        continue-on-error: true 

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # JOB 2 : Build & Artifacts (Étudiant B)
  build-and-push:
    needs: quality-and-tests
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Image using script
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

# --- ÉTAPE SEC-OPS : SCAN TRIVY ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/api-nodejs:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # --- ÉTAPE SEC-OPS : GÉNÉRATION DU RAPPORT ---
      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: trivy-results.sarif

      - name: Push Image to GHCR
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/api-nodejs"
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

          
 # JOB 3 : CD - Déploiement Azure (Étudiant C)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # On ajoute les infos du registre directement ici
          images: 'ghcr.io/${{ github.repository_owner }}/api-nodejs:latest'
          
      - name: Run Deploy Script
        run: |
          chmod +x ./scripts/deploy.sh
          ./scripts/deploy.sh
        env:
          AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}