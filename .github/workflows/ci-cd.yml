name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Code Quality (Lint)
        # Bloque le pipeline si le code ne respecte pas les règles ESLint [cite: 71]
        run: |
          cd app
          # npx eslint .
          npm run lint

      - name: Run Unit Tests
        # le script test.sh doit être dans /scripts/test.sh à la racine
        run: |
          chmod +x ./scripts/test.sh
          ./scripts/test.sh

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Généré automatiquement par GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # Génere par nous, dans SonarQube cloud