name: CI Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    
    # Service de base de données pour les tests [cite: 31]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: conduit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requis pour SonarCloud

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Code Quality (Lint)
        # Analyse ESLint 
        run: |
          cd app
          npm run lint || echo "Linting failed but continuing for educational purposes"
        continue-on-error: true

      - name: Run Unit Tests
        # Exécution du script de test automatisé [cite: 49, 66]
        env:
          # URL pointant vers le service Postgres ci-dessus
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/conduit?schema=public"
        run: |
         cd app
          npx prisma db push --schema=src/prisma/schema.prisma
          cd ..
          chmod +x ./scripts/test.sh
          ./scripts/test.sh
        continue-on-error: true # <--- C'est cette ligne laisser le pipeline continuer meme avec des erreurs

      - name: SonarCloud Scan
        # Intégration de la qualité SonarCloud [cite: 71, 21]
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
